services:
  free-llm-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: free-llm-router
    restart: unless-stopped
    ports:
      - "11451:11451"
    environment:
      - PORT=11451
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/router.db
      - API_KEY=${API_KEY:-}
      - CREDENTIAL_KEY=${CREDENTIAL_KEY:-}
      - AUTO_TASK_CRON=true
    volumes:
      - ./data:/app/data
