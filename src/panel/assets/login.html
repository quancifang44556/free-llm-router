<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · free-llm-router</title>
<link rel="stylesheet" href="/panel/style.css">
</head>
<body class="login-body">
<div class="login-card">
  <div class="login-brand">
    <span class="brand-mark" aria-hidden="true">
      <svg class="brand-logo" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="2" />
        <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14" />
      </svg>
    </span>
    <span>free-llm-router</span>
  </div>
  <h1>登录管理面板</h1>
  <p class="hint">输入部署时设置的主密钥（API_KEY）。</p>

  <form id="login-form" autocomplete="off">
    <input id="apikey" type="password" placeholder="API 密钥" autocomplete="current-password" autofocus>
    <button type="submit" id="login-btn">登录</button>
  </form>

  <p id="login-msg" class="login-msg"></p>

  <p class="hint login-foot">
    Cloudflare 部署用 <code>wrangler secret put API_KEY</code> 设置；Node / VPS 部署用环境变量 <code>API_KEY</code>。<br>
    密钥只存在本机浏览器（localStorage），每个请求以 <code>Authorization</code> 头发送。
  </p>
</div>

<script src="/panel/login.js"></script>
</body>
</html>
